services:
  frontend:
    image: nginx:1.27-alpine
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
  backend:
    build:
      context: .
      target: backend
    environment:
      SQLITE_PATH: /app/storage/inmoscore.sqlite
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      REFRESH_ENABLED: ${REFRESH_ENABLED:-true}
      REFRESH_TIME: ${REFRESH_TIME:-06:30}
      TZ: America/Lima
    volumes:
      - inmoscore-data:/app/data
      - inmoscore-storage:/app/storage
      - inmoscore-captures:/app/captures
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
volumes:
  inmoscore-data:
  inmoscore-storage:
  inmoscore-captures:
